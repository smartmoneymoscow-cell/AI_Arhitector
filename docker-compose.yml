services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_SERVICE_URL=http://llm-service:8081
      - BLENDER_SERVICE_URL=http://blender-service:8082
      - REDIS_URL=redis://redis:6379/0
      - PORT=8080
    depends_on:
      - llm-service
      - blender-service
      - redis

  llm-service:
    build:
      context: .
      dockerfile: llm-service/Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PORT=8081

  blender-service:
    build:
      context: .
      dockerfile: blender-service/Dockerfile
    environment:
      - PORT=8082
      - BLENDER_PATH=blender
      - OUTPUT_DIR=/app/output
      - LLM_SERVICE_URL=http://llm-service:8081
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./output:/app/output
    depends_on:
      - redis

  # Celery Worker для async задач генерации
  celery-worker:
    build:
      context: .
      dockerfile: blender-service/Dockerfile
    command: celery -A shared.celery_app worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BLENDER_PATH=blender
      - OUTPUT_DIR=/app/output
      - LLM_SERVICE_URL=http://llm-service:8081
    volumes:
      - ./output:/app/output
    depends_on:
      - redis
      - blender-service

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
