# AI_Arhitector — Docker Compose (Production)
# STRICTLY MICROSERVICE: Client → Nginx → Gateway → LLM / Blender
# NO monolith. NO direct Nginx→service bypass.

services:

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./output:/var/www/output:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    expose: ["8080"]
    environment:
      - LLM_SERVICE_URL=http://llm-service:8081
      - BLENDER_SERVICE_URL=http://blender-service:8082
      - REDIS_URL=redis://redis:6379/0
      - OUTPUT_DIR=/app/output
      - PORT=8080
      - ARCH_API_KEYS=${ARCH_API_KEYS:?Set ARCH_API_KEYS in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://yourdomain.com}
    volumes: [./output:/app/output]
    depends_on:
      redis: {condition: service_healthy}
      llm-service: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8080/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  llm-service:
    build:
      context: .
      dockerfile: llm.Dockerfile
    expose: ["8081"]
    environment:
      # OpenRouter keys (4 штуки, round-robin)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      - OPENROUTER_FALLBACK_KEYS=${OPENROUTER_FALLBACK_KEYS:-}
      - OPENROUTER_BASE=https://openrouter.ai/api/v1
      # Gemini keys (8 штук, fallback cascade)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      # Model Manager
      - MODEL_DISCOVERY_INTERVAL=${MODEL_DISCOVERY_INTERVAL:-14400}
      - MODEL_MAX_CASCADE=${MODEL_MAX_CASCADE:-12}
      - MODEL_TIMEOUT=${MODEL_TIMEOUT:-30}
      - CB_FAILURES=${CB_FAILURES:-3}
      - CB_COOLDOWN=${CB_COOLDOWN:-300}
      - LLM_MODEL=${LLM_MODEL:-auto}
      # Redis + server
      - REDIS_URL=redis://redis:6379/1
      - PORT=8081
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8081/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  blender-service:
    build:
      context: .
      dockerfile: blender.Dockerfile
    expose: ["8082"]
    environment:
      - PORT=8082
      - BLENDER_PATH=blender
      - OUTPUT_DIR=/app/output
      - LLM_SERVICE_URL=http://llm-service:8081
      - REDIS_URL=redis://redis:6379/0
      - BLENDER_TIMEOUT=300
      - RENDER_INTERIOR_TIMEOUT=600
    volumes: [./output:/app/output]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8082/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    expose: ["6379"]
    volumes: [redis-data:/data]
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 60 1000 --tcp-backlog 511
      --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Certbot for SSL auto-renewal
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on: [nginx]

  # ═══════════════════════════════════════════════════════════════
  # AEDIFEX — 3D Architectural Editor (Phase 1)
  # Does NOT replace existing services — adds editor UI + bridge
  # ═══════════════════════════════════════════════════════════════

  aedifex-bridge:
    build:
      context: ./aedifex-bridge
      dockerfile: Dockerfile
    expose: ["8085"]
    environment:
      - GATEWAY_URL=http://gateway:8080
      - LLM_SERVICE_URL=http://llm-service:8081
      - IFC_SERVICE_URL=http://ifc-service:8083
      - CAD_SERVICE_URL=http://cad-service:8087
      - BLENDER_SERVICE_URL=http://blender-service:8082
      - BRIDGE_PORT=8085
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8085/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  aedifex-editor:
    build:
      context: ./aedifex-editor
      dockerfile: Dockerfile
    ports: ["3002:3002"]
    environment:
      - NEXT_PUBLIC_API_URL=http://aedifex-bridge:8085
      - AI_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_BASE_URL=${OPENROUTER_BASE:-https://openrouter.ai/api/v1}
    depends_on:
      aedifex-bridge: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  redis-data:
