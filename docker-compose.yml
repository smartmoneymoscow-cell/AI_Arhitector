services:
  # ═══════════════════════════════════════════════════════════
  # API Gateway — main entry point
  # ═══════════════════════════════════════════════════════════
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_SERVICE_URL=http://llm-service:8081
      - BLENDER_SERVICE_URL=http://blender-service:8082
      - OUTPUT_DIR=/app/output
      - PORT=8080
    volumes:
      - ./output:/app/output
      - ./frontend:/app/frontend:ro
    depends_on:
      - llm-service
      - blender-service
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # LLM Service — prompt parsing via OpenRouter
  # ═══════════════════════════════════════════════════════════
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemini-2.5-flash}
      - PORT=8081
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # Blender Service — 3D generation + rendering + preview
  # ═══════════════════════════════════════════════════════════
  blender-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8082
      - BLENDER_PATH=blender
      - OUTPUT_DIR=/app/output
      - LLM_SERVICE_URL=http://llm-service:8081
      - BLENDER_TIMEOUT=300
      - RENDER_INTERIOR_TIMEOUT=600
    volumes:
      - ./output:/app/output
    depends_on:
      - llm-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ═══════════════════════════════════════════════════════════
  # Redis — for Celery async tasks (optional)
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # Celery Worker — async generation tasks (optional)
  # ═══════════════════════════════════════════════════════════
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A shared.celery_app worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BLENDER_PATH=blender
      - OUTPUT_DIR=/app/output
      - LLM_SERVICE_URL=http://llm-service:8081
    volumes:
      - ./output:/app/output
    depends_on:
      - redis
      - blender-service
    restart: unless-stopped

volumes:
  redis-data:
