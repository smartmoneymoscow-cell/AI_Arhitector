# AI_Arhitector — Docker Compose (Production)
# Client → Nginx (:80) → Gateway (:8080) / LLM (:8081) / Blender (:8082)
# Redis (:6379) — LLM cache + Celery broker

services:

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./output:/var/www/output:ro
    depends_on: [gateway, llm-service, blender-service]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    expose: ["8080"]
    environment:
      - LLM_SERVICE_URL=http://llm-service:8081
      - BLENDER_SERVICE_URL=http://blender-service:8082
      - REDIS_URL=redis://redis:6379/0
      - OUTPUT_DIR=/app/output
      - PORT=8080
      - ARCH_API_KEYS=${ARCH_API_KEYS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes: [./output:/app/output]
    depends_on:
      redis: {condition: service_healthy}
      llm-service: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8080/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  llm-service:
    build:
      context: .
      dockerfile: llm.Dockerfile
    expose: ["8081"]
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE=https://openrouter.ai/api/v1
      - REDIS_URL=redis://redis:6379/1
      - PORT=8081
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8081/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  blender-service:
    build:
      context: .
      dockerfile: blender.Dockerfile
    expose: ["8082"]
    environment:
      - PORT=8082
      - BLENDER_PATH=blender
      - OUTPUT_DIR=/app/output
      - LLM_SERVICE_URL=http://llm-service:8081
      - REDIS_URL=redis://redis:6379/0
      - BLENDER_TIMEOUT=300
      - RENDER_INTERIOR_TIMEOUT=600
    volumes: [./output:/app/output]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
      # GPU (раскомментировать для NVIDIA):
      # resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: 1
      #         capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8082/health'); assert r.status_code==200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    expose: ["6379"]
    volumes: [redis-data:/data]
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 60 1000 --tcp-backlog 511
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
