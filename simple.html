<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Architect AI — 3D Interior & Building Designer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:#0f0f11;color:#fafafa}
body{display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
.top{height:56px;background:#18181b;border-bottom:1px solid #2e2e33;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff}
.logo-text{font-size:16px;font-weight:700}.logo-text span{color:#a78bfa}
.main{display:flex;flex:1;overflow:hidden}
.chat{width:400px;flex-shrink:0;background:#0f0f11;display:flex;flex-direction:column;border-right:1px solid #2e2e33}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;display:flex;flex-direction:column}.msg.user{align-self:flex-end}.msg.ai{align-self:flex-start}
.bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.msg.user .bubble{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border-radius:16px 16px 4px 16px}
.msg.ai .bubble{background:#18181b;border:1px solid #2e2e33;color:#fafafa;border-radius:4px 16px 16px 16px}
.input-area{padding:12px 16px 16px;flex-shrink:0;background:linear-gradient(180deg,transparent,#0f0f11 20%)}
.input-box{background:#18181b;border:1px solid #2e2e33;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;padding:8px 12px}
.input-box:focus-within{border-color:#8b5cf6;box-shadow:0 0 0 2px rgba(139,92,246,.15)}
textarea{flex:1;background:transparent;border:none;outline:none;color:#fafafa;font-family:inherit;font-size:14px;resize:none;min-height:24px;max-height:120px;line-height:1.6}
textarea::placeholder{color:#71717a}
.send{width:36px;height:36px;border-radius:10px;border:none;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send:hover{box-shadow:0 4px 16px rgba(139,92,246,.5)}
.viewer{flex:1;display:flex;flex-direction:column;min-width:0}
.viewer-bar{height:48px;background:#18181b;border-bottom:1px solid #2e2e33;display:flex;align-items:center;padding:0 16px;gap:8px}
.vtab{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#a1a1aa}
.vtab:hover{color:#fafafa}.vtab.active{background:#27272a;color:#a78bfa;font-weight:600}
canvas{width:100%;height:100%;display:block}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#71717a}
.empty-icon{font-size:48px}
.typing{display:flex;gap:5px;padding:12px 16px;background:#18181b;border:1px solid #2e2e33;border-radius:4px 16px 16px 16px;align-self:flex-start}
.typing-dot{width:6px;height:6px;border-radius:50%;background:#8b5cf6;animation:bounce .9s infinite}
.typing-dot:nth-child(2){animation-delay:.17s}.typing-dot:nth-child(3){animation-delay:.34s}
@keyframes bounce{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.qbtn{padding:8px 16px;border-radius:20px;border:1px solid #3f3f46;background:#18181b;color:#a1a1aa;font-size:12px;cursor:pointer;font-family:inherit}
.qbtn:hover{border-color:#8b5cf6;color:#a78bfa}
.status{font-size:11px;padding:4px 8px;border-radius:6px;display:inline-block}
.status.ok{background:rgba(34,197,94,.15);color:#22c55e}
.status.err{background:rgba(239,68,68,.15);color:#ef4444}
.progress{height:4px;background:#27272a;border-radius:2px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,#8b5cf6,#6366f1);border-radius:2px;transition:width .3s}
</style>
</head>
<body>
<div class="top">
  <div class="logo">
    <div class="logo-mark">A</div>
    <div class="logo-text">Architect<span>.ai</span></div>
  </div>
  <div id="status" class="status ok">● Connected</div>
</div>
<div class="main">
  <div class="chat">
    <div class="messages" id="msgs">
      <div class="empty" id="welcome">
        <div class="empty-icon">🏗</div>
        <h2>Что вы хотите построить?</h2>
        <p>Опишите здание или интерьер — я сгенерирую 3D-модель</p>
        <div class="quick">
          <button class="qbtn" onclick="sendQuick('Современный коттедж 2 этажа 12x10 из кирпича')">🏠 Коттедж</button>
          <button class="qbtn" onclick="sendQuick('Ванная комната хайтек 3x4 с джакузи')">🛁 Ванная</button>
          <button class="qbtn" onclick="sendQuick('Кухня в стиле лофт 4x5')">🍳 Кухня</button>
          <button class="qbtn" onclick="sendQuick('Офисное помещение 8x10 современное')">🏢 Офис</button>
        </div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-box">
        <textarea id="inp" placeholder="Опишите здание или интерьер..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button class="send" onclick="send()">➤</button>
      </div>
    </div>
  </div>
  <div class="viewer">
    <div class="viewer-bar">
      <button class="vtab active" onclick="setView('3d')">◆ 3D</button>
      <button class="vtab" onclick="setView('plan')">⊞ План</button>
      <button class="vtab" onclick="setView('section')">⊟ Разрез</button>
    </div>
    <div id="canvasWrap" style="flex:1;position:relative;background:#1e1e23">
      <canvas id="c3d" style="display:none"></canvas>
      <div id="emptyState" class="empty">
        <div class="empty-icon">🖱</div>
        <p>Опишите здание в чате — 3D появится здесь</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ═══ CONFIG ═══
const GATEWAY = 'https://architect-gateway-3guo.onrender.com';
const BLENDER = 'https://architect-gateway-3guo.onrender.com'; // через gateway proxy
const LLM = 'https://architect-gateway-3guo.onrender.com';

// ═══ THREE.JS ═══
let scene, camera, renderer, controls;
function init3D() {
  const wrap = document.getElementById('canvasWrap');
  const canvas = document.getElementById('c3d');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1e1e23);
  camera = new THREE.PerspectiveCamera(60, wrap.clientWidth/wrap.clientHeight, 0.1, 1000);
  camera.position.set(15, 10, 15);
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(10, 20, 10);
  scene.add(dir);
  const hemi = new THREE.HemisphereLight(0x87ceeb, 0x362d1b, 0.4);
  scene.add(hemi);
  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
  window.addEventListener('resize', () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });
}

function loadGLB(url) {
  if(!scene) init3D();
  document.getElementById('c3d').style.display='block';
  document.getElementById('emptyState').style.display='none';
  const loader = new THREE.GLTFLoader();
  loader.load(url, gltf => {
    // Remove old
    const rm = [];
    scene.traverse(c => { if(c.isMesh && c.name!=='Ground') rm.push(c); });
    rm.forEach(o => { if(o.geometry)o.geometry.dispose(); if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();} scene.remove(o); });
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    controls.target.copy(center);
    camera.position.set(center.x+maxDim*1.5, center.y+maxDim, center.z+maxDim*1.5);
    controls.update();
  }, undefined, err => console.error('GLB load error:', err));
}

// ═══ CHAT ═══
const msgsEl = document.getElementById('msgs');
const inpEl = document.getElementById('inp');
let isProcessing = false;

function addMsg(role, html) {
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="bubble">' + html + '</div>';
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if(t) t.remove();
}

function sendQuick(text) {
  inpEl.value = text;
  send();
}

async function send() {
  const text = inpEl.value.trim();
  if(!text || isProcessing) return;
  isProcessing = true;
  inpEl.value = '';
  addMsg('user', esc(text));
  showTyping();

  try {
    // Step 1: Parse with LLM
    addMsg('ai', '🧠 Анализирую запрос...');
    const parseR = await fetch(GATEWAY + '/api/v1/parse', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    
    if(!parseR.ok) throw new Error('Parse failed: ' + parseR.status);
    const params = await parseR.json();
    console.log('Parsed:', params);
    
    // Show parsed info
    const genType = params.object_type || 'building';
    const label = genType === 'interior' ? '🏠 Интерьер' : genType === 'landscape' ? '🌳 Ландшафт' : '🏗 Здание';
    let desc = `${label}: ${params.style||'современный'}`;
    if(params.width_m && params.length_m) desc += `, ${params.width_m}×${params.length_m}м`;
    if(params.floors) desc += `, ${params.floors} этажа`;
    if(params.room_type) desc += `, ${params.room_type}`;
    addMsg('ai', desc);
    
    // Step 2: Generate 3D model via blender service
    addMsg('ai', '⚡ Генерирую 3D модель...');
    const genR = await fetch(BLENDER + '/api/v1/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt: text, quality: 'standard'})
    });
    
    if(!genR.ok) {
      const errText = await genR.text();
      throw new Error('Generation failed: ' + genR.status + ' ' + errText.substring(0, 200));
    }
    
    const blob = await genR.blob();
    console.log('GLB blob size:', blob.size);
    
    if(blob.size > 500) {
      const url = URL.createObjectURL(blob);
      loadGLB(url);
      addMsg('ai', '✅ 3D модель готова! Используйте мышь для вращения.');
    } else {
      addMsg('ai', '⚠️ Модель не создана. Попробуйте другой промт.');
    }
    
  } catch(e) {
    console.error('Error:', e);
    addMsg('ai', '❌ Ошибка: ' + e.message);
  }
  
  hideTyping();
  isProcessing = false;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setView(v) {
  document.querySelectorAll('.vtab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

// Auto-resize textarea
inpEl.addEventListener('input', () => {
  inpEl.style.height = 'auto';
  inpEl.style.height = Math.min(inpEl.scrollHeight, 120) + 'px';
});

// Check backend health
fetch(GATEWAY + '/api/v1/health').then(r => r.json()).then(d => {
  document.getElementById('status').innerHTML = '● Connected';
  document.getElementById('status').className = 'status ok';
}).catch(e => {
  document.getElementById('status').innerHTML = '● Disconnected';
  document.getElementById('status').className = 'status err';
});
</script>
</body>
</html>
