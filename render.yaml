# ════════════════════════════════════════════════════════════════
# Render.com deployment — Architect v11.3.0
# Matches actual deployed service names on Render
# ════════════════════════════════════════════════════════════════

services:
  - type: web
    name: architect-gateway
    runtime: docker
    dockerfilePath: ./gateway.Dockerfile
    rootDir: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_SERVICE_URL
        value: https://architect-llm-1s1j.onrender.com
      - key: BLENDER_SERVICE_URL
        value: https://ai-arch-blender3d.onrender.com
      - key: BLENDER_SERVICE_URL_2
        value: https://architect-blender.onrender.com
      - key: AGENT_POOL_URL
        value: ""
      - key: KAGGLE_RENDERER_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: PORT
        value: "8080"
      - key: ARCH_API_KEYS
        value: "arch-prod-key-2024"
      - key: CORS_ORIGINS
        value: "https://smartmoneymoscow-cell.github.io"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: architect-llm
    runtime: docker
    dockerfilePath: ./llm.Dockerfile
    rootDir: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_FALLBACK_KEYS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_FALLBACK_KEYS
        sync: false
      - key: REDIS_URL
        value: ""
      - key: PORT
        value: "8081"
      - key: KEY_COOLDOWN_RATE_LIMIT_SEC
        value: "60"
      - key: KEY_COOLDOWN_QUOTA_SEC
        value: "86400"

  - type: web
    name: architect-blender
    runtime: docker
    dockerfilePath: ./blender.Dockerfile
    rootDir: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: BLENDER_PATH
        value: blender
      - key: OUTPUT_DIR
        value: /app/output
      - key: LLM_SERVICE_URL
        value: https://architect-llm-1s1j.onrender.com
      - key: REDIS_URL
        value: ""
