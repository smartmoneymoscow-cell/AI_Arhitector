services:
  - type: web
    name: architect
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: "8080"
      - key: BLENDER_PATH
        value: "blender"
