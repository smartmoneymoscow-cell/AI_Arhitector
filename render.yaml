services:
  # ════════════════════════════════════════════════════════════
  # CORE SERVICES
  # ════════════════════════════════════════════════════════════

  # Gateway — маршрутизатор + фронтенд
  - type: web
    name: architect
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    rootDir: gateway
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_SERVICE_URL
        value: https://ai-arch-llmproxy.onrender.com
      - key: BLENDER_SERVICE_URL
        value: https://ai-arch-blender3d.onrender.com
      - key: GEOMETRY_SERVICE_URL
        value: https://architect-geometry.onrender.com
      - key: IFC_SERVICE_URL
        value: https://architect-ifc.onrender.com
      - key: ML_SERVICE_URL
        value: https://architect-ml.onrender.com
      - key: DATA_SERVICE_URL
        value: https://architect-data.onrender.com
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: PORT
        value: "8080"

  # LLM Service — прокси к OpenRouter + парсинг
  - type: web
    name: ai-arch-llmproxy
    runtime: docker
    dockerfilePath: ./llm-service/Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: "8081"

  # Blender Service — генерация зданий + интерьеров
  - type: web
    name: ai-arch-blender3d
    runtime: docker
    dockerfilePath: ./blender-service/Dockerfile
    rootDir: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: BLENDER_PATH
        value: blender
      - key: OUTPUT_DIR
        value: /app/output
      - key: LLM_SERVICE_URL
        value: https://ai-arch-llmproxy.onrender.com

  # ════════════════════════════════════════════════════════════
  # NEW SERVICES — Phase 1-5
  # ════════════════════════════════════════════════════════════

  # Geometry Service — Shapely + NetworkX spatial analysis
  - type: web
    name: architect-geometry
    runtime: docker
    dockerfilePath: ./geometry-service/Dockerfile
    rootDir: geometry-service
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8083"

  # IFC Service — IfcOpenShell import/export
  - type: web
    name: architect-ifc
    runtime: docker
    dockerfilePath: ./ifc-service/Dockerfile
    rootDir: ifc-service
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8084"
      - key: OUTPUT_DIR
        value: /app/output

  # ML Service — ONNX inference + style/room classification
  - type: web
    name: architect-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    rootDir: ml-service
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8085"

  # Data Service — project storage + vector search
  - type: web
    name: architect-data
    runtime: docker
    dockerfilePath: ./data-service/Dockerfile
    rootDir: data-service
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8086"
      - key: DATA_DIR
        value: /app/data
