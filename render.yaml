# ════════════════════════════════════════════════════════════
# Render.com deployment — Architect v7.0
# Only active services (3 + Redis)
# Dead services removed: geometry, ifc, ml, data, cad, freecad, vectordb, graphdb
# See ROADMAP.md for future service plans
# ════════════════════════════════════════════════════════════

services:
  # ─── CORE SERVICES ───────────────────────────────────────

  - type: web
    name: architect
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    rootDir: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: LLM_SERVICE_URL
        value: https://ai-arch-llmproxy.onrender.com
      - key: BLENDER_SERVICE_URL
        value: https://ai-arch-blender3d.onrender.com
      - key: REDIS_URL
        value: redis://red-xxx:6379  # Replace with actual Redis URL
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: PORT
        value: "8080"
      - key: ARCH_API_KEYS
        sync: false
      - key: CORS_ORIGINS
        value: "https://smartmoneymoscow-cell.github.io"

  - type: web
    name: ai-arch-llmproxy
    runtime: docker
    dockerfilePath: ./llm-service/Dockerfile
    rootDir: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REDIS_URL
        value: redis://red-xxx:6379  # Replace with actual Redis URL
      - key: PORT
        value: "8081"

  - type: web
    name: ai-arch-blender3d
    runtime: docker
    dockerfilePath: ./blender-service/Dockerfile
    rootDir: .
    region: oregon
    plan: standard  # Blender needs more RAM
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: BLENDER_PATH
        value: blender
      - key: OUTPUT_DIR
        value: /app/output
      - key: LLM_SERVICE_URL
        value: https://ai-arch-llmproxy.onrender.com
      - key: REDIS_URL
        value: redis://red-xxx:6379  # Replace with actual Redis URL

  # ─── REDIS ───────────────────────────────────────────────

  - type: redis
    name: architect-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
