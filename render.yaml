services:
  # Gateway — маршрутизатор + фронтенд
  - type: web
    name: architect
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    rootDir: gateway
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_SERVICE_URL
        value: https://ai-arch-llmproxy.onrender.com
      - key: BLENDER_SERVICE_URL
        value: https://ai-arch-blender3d.onrender.com
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: PORT
        value: "8080"

  # LLM Service — прокси к OpenRouter + парсинг
  - type: web
    name: ai-arch-llmproxy
    runtime: docker
    dockerfilePath: ./llm-service/Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: "8081"

  # Blender Service — генерация зданий + интерьеров
  - type: web
    name: ai-arch-blender3d
    runtime: docker
    dockerfilePath: ./blender-service/Dockerfile
    rootDir: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8082"
      - key: BLENDER_PATH
        value: blender
      - key: OUTPUT_DIR
        value: /app/output
      - key: LLM_SERVICE_URL
        value: https://ai-arch-llmproxy.onrender.com
