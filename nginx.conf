# ═══════════════════════════════════════════════════════════════
# Nginx — STRICTLY routes ALL traffic through Gateway
# NO direct Nginx → LLM/Blender bypass
# ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_generate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_parse:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_health:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ONLY Gateway as upstream — all routing happens inside Gateway
upstream gateway {
    server gateway:8080;
    keepalive 16;
}

proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m;

# ─── HTTP → HTTPS redirect ───
server {
    listen 80;
    server_name _;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check over HTTP (for load balancers)
    location = /health {
        limit_req zone=api_health burst=10 nodelay;
        proxy_pass http://gateway/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ───
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://openrouter.ai wss: ws:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    limit_conn conn_limit 20;

    # ═══════════════════════════════════════════════════════════
    # ALL API ROUTES → GATEWAY ONLY
    # Gateway handles internal routing to LLM/Blender services
    # ═══════════════════════════════════════════════════════════

    # Health
    location = /health {
        limit_req zone=api_health burst=10 nodelay;
        proxy_pass http://gateway/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Parse (via Gateway → LLM Service)
    location /api/v1/parse {
        limit_req zone=api_parse burst=5 nodelay;
        proxy_pass http://gateway/api/v1/parse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_cache api_cache;
        proxy_cache_key "$request_uri|$request_body";
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Generate (via Gateway → Blender Service)
    location /api/v1/generate {
        limit_req zone=api_generate burst=2 nodelay;
        proxy_pass http://gateway/api/v1/generate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # Orchestrator (full pipeline)
    location /api/v1/orchestrator {
        limit_req zone=api_generate burst=2 nodelay;
        proxy_pass http://gateway/api/v1/orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
    }

    # SSE streaming (buffering OFF)
    location ~ ^/api/v1/orchestrator/.*/stream$ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Preview (via Gateway → Blender Service)
    location /api/v1/preview {
        limit_req zone=api_generate burst=3 nodelay;
        proxy_pass http://gateway/api/v1/preview;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 16K render (via Gateway → Blender Service)
    location /api/v1/render/16k {
        limit_req zone=api_generate burst=1 nodelay;
        proxy_pass http://gateway/api/v1/render/16k;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 7200s;
    }

    # Chat (via Gateway → LLM Service)
    location /api/v1/chat {
        limit_req zone=api_parse burst=3 nodelay;
        proxy_pass http://gateway/api/v1/chat;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Clarify (via Gateway)
    location /api/v1/orchestrator/clarify {
        limit_req zone=api_generate burst=2 nodelay;
        proxy_pass http://gateway/api/v1/orchestrator/clarify;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
    }

    # Agents list (via Gateway)
    location = /api/v1/orchestrator/agents {
        limit_req zone=api_health burst=10 nodelay;
        proxy_pass http://gateway/api/v1/orchestrator/agents;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Output files
    location /output/ {
        alias /var/www/output/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Static frontend
    location / {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
