name: E2E Tests (Post-Release)

on:
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
    branches: [main]

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest playwright pytest-playwright
          playwright install chromium --with-deps

      - name: Wait for staging deploy
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "Staging is ready"
              exit 0
            fi
            echo "Waiting for staging... ($i/30)"
            sleep 10
          done
          echo "Staging not ready"
          exit 1

      - name: Run E2E tests (random prompts)
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
          E2E_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          pytest tests/e2e/test_chat_e2e.py \
            -v \
            --timeout=300 \
            --tb=short \
            -k "test_chat_sends_and_receives or test_preview_window_shows_3d" \
            --html=e2e-report.html --self-contained-html \
            || echo "E2E tests completed with issues"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test_screenshots/
          retention-days: 30

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-report.html

      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = { validations: [] };
            try {
              report = JSON.parse(fs.readFileSync('test_screenshots/analysis_report.json', 'utf8'));
            } catch {}
            
            const passed = report.validations.filter(v => v.keyword_match).length;
            const total = report.validations.length;
            
            const body = `## 🧪 E2E Test Results
            
            | Metric | Value |
            |--------|-------|
            | Prompts tested | ${total} |
            | Keywords matched | ${passed}/${total} |
            | Screenshots | See artifact |
            
            ${passed === total ? '✅ All prompts matched!' : '⚠️ Some prompts did not match expected keywords'}
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
