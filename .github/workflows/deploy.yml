name: Deploy

on:
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
    branches: [main]

jobs:
  staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ] || [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Render secrets not configured — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Wait for live
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.[0].status')
            [ "$STATUS" = "live" ] && echo "OK" && exit 0
            sleep 10
          done
          exit 1

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/health")
          [ "$CODE" = "200" ] || exit 1

  production:
    runs-on: ubuntu-latest
    needs: staging
    if: ${{ !cancelled() && needs.staging.result != 'failure' }}
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_PROD_SERVICE_ID }}" ] || [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Production secrets not configured — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_PROD_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
