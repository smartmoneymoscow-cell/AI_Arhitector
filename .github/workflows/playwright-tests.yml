name: Playwright E2E (Post-Release)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  send-button-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest playwright pytest-playwright
          playwright install chromium --with-deps

      - name: Wait for deploy
        run: |
          URL="https://architect-gateway-3guo.onrender.com"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ]; then
              if curl -s "$URL" | grep -q 'id="sendBtn"'; then
                echo "New code deployed"
                exit 0
              fi
              echo "Old code still live, waiting... ($i/20)"
            fi
            sleep 15
          done
          echo "Using whatever is deployed"

      - name: Run send button tests
        env:
          GATEWAY_URL: https://architect-gateway-3guo.onrender.com
        run: |
          python -m pytest tests/test_e2e_playwright.py -v --tb=short

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
