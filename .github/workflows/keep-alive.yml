name: Keep-Alive Pinger
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (Render sleeps after 15min)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping all services
        run: |
          echo "=== Keep-Alive Ping $(date -u) ==="
          SERVICES=(
            "Gateway|https://architect-gateway-3guo.onrender.com/api/v1/health"
            "LLM-5mdk|https://architect-llm-5mdk.onrender.com/api/v1/health"
            "LLM-1s1j|https://architect-llm-1s1j.onrender.com/api/v1/health"
            "LLM-s5q7|https://architect-llm-s5q7.onrender.com/api/v1/health"
            "LLM-zczl|https://architect-llm-zczl.onrender.com/api/v1/health"
            "LLM-2pmo|https://architect-llm-2pmo.onrender.com/api/v1/health"
            "LLM-sdrh|https://architect-llm-sdrh.onrender.com/api/v1/health"
            "LLM-qarj|https://architect-llm-qarj.onrender.com/api/v1/health"
            "Blender|https://ai-arch-blender3d.onrender.com/api/v1/health"
          )
          OK=0
          FAIL=0
          for svc in "${SERVICES[@]}"; do
            NAME="${svc%%|*}"
            URL="${svc##*|}"
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 60 "$URL" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "  ✅ $NAME: alive (HTTP $CODE)"
              OK=$((OK + 1))
            else
              echo "  ❌ $NAME: DOWN (HTTP $CODE)"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "Result: $OK alive, $FAIL down"
          if [ "$FAIL" -gt 0 ]; then
            echo "::warning::$FAIL services are DOWN"
          fi
          # Always succeed - we just want to keep services alive
          exit 0
