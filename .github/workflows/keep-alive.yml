name: Keep-Alive Pinger
on:
  schedule:
    - cron: '*/8 * * * *'  # Every 8 minutes (Render sleeps after 15min)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping all services
        run: |
          echo "=== Keep-Alive Ping $(date -u) ==="
          SERVICES=(
            "Gateway|https://architect-gateway-3guo.onrender.com/health"
            "LLM-5mdk|https://architect-llm-5mdk.onrender.com/health"
            "LLM-1s1j|https://architect-llm-1s1j.onrender.com/health"
            "LLM-s5q7|https://architect-llm-s5q7.onrender.com/health"
            "Blender|https://ai-arch-blender3d.onrender.com/health"
          )
          OK=0
          FAIL=0
          for svc in "${SERVICES[@]}"; do
            NAME="${svc%%|*}"
            URL="${svc##*|}"
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 "$URL" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "  ✅ $NAME: alive (HTTP $CODE)"
              ((OK++))
            else
              echo "  ❌ $NAME: DOWN (HTTP $CODE)"
              ((FAIL++))
            fi
          done
          echo "\nResult: $OK alive, $FAIL down"
          if [ "$FAIL" -gt 0 ]; then
            echo "::warning::$FAIL services are DOWN"
          fi
