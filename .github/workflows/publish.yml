name: Publish Images

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway
            file: gateway.Dockerfile
          - name: llm
            file: llm.Dockerfile
          - name: blender
            file: blender.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "tag=ghcr.io/${REPO}/${{ matrix.name }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${REPO}/${{ matrix.name }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
