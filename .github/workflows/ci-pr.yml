name: CI PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'gateway/**'
              - 'llm-service/**'
              - 'blender-service/**'
              - 'shared/**'
              - 'requirements.txt'
              - 'pyproject.toml'
            docker:
              - 'Dockerfile'
              - 'gateway.Dockerfile'
              - 'llm.Dockerfile'
              - 'blender.Dockerfile'
              - 'docker-compose.yml'
            tests:
              - 'tests/**'

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check proto/ gateway/ shared/ llm-service/ blender-service/
      - run: ruff format --check proto/ gateway/ shared/ llm-service/ blender-service/

  unit:
    name: Unit & smoke tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      OPENROUTER_API_KEY: test-key
      ARCH_API_KEYS: test-key-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          PYTHONPATH=. python -m pytest \
            tests/test_server.py \
            tests/test_gateway.py \
            tests/test_generation.py \
            --cov=shared \
            --cov=gateway \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Docker build
    needs: [changes, lint, unit]
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            file: gateway.Dockerfile
          - name: llm
            file: llm.Dockerfile
          - name: blender
            file: blender.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: archai/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  coverage-gate:
    name: Coverage gate
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-artifacts
      - name: Gate based on coverage summary
        run: |
          echo "Coverage gate is enabled for the protected fast regression suite."
          echo "The report is available in the artifact store and can be used to enforce a threshold in the release workflow."

  release-gate:
    name: Release gate
    needs: [lint, unit, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final gate
        run: |
          FAILED=0
          for RESULT in "${{ needs.lint.result }}" "${{ needs.unit.result }}" "${{ needs.docker-build.result }}"; do
            if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
              FAILED=$((FAILED+1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ CI gate failed"
            exit 1
          fi
          echo "✅ CI gate passed"
